# ┃                    Autostart Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Autostart wiki https://wiki.hyprland.org/Configuring/Keywords/#executing
# exec-once already runs each command detached, so no trailing & is needed.

# ## Environment for D-Bus activated and systemd user services (first, so
# ## everything started below sees it; fixes slow app launches)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE HYPRLAND_INSTANCE_SIGNATURE

# ## Desktop services
exec-once = swaybg -o \* -i /usr/share/wallpapers/cachyos-wallpapers/Metal.png -m fill
exec-once = waybar
exec-once = fcitx5 -d
exec-once = mako
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-kde-authentication-agent-1

# ## OSD for volume (see scripts/volume.sh): wob reads levels from this FIFO
exec-once = sh -c 'f=/tmp/$HYPRLAND_INSTANCE_SIGNATURE.wob; rm -f "$f"; mkfifo "$f" && tail -f "$f" | wob'

# ## Clipboard history
exec-once = wl-paste --type text --watch cliphist store # Stores only text
exec-once = wl-paste --type image --watch cliphist store # Stores only images

# ## Idle configuration
exec-once = $idlehandler

# ## i3-style workspace stacking (see scripts/workspace-stack.py)
exec-once = ~/.config/hypr/scripts/workspace-stack.py

# ## My autostarts (workspace assignment lives in windowrules.conf)
exec-once = librewolf
exec-once = flatpak run org.ferdium.Ferdium
exec-once = flatpak run org.signal.Signal
exec-once = thunderbird
exec-once = flatpak run dev.pulsar_edit.Pulsar
# exec-once = flatpak run com.logseq.Logseq
exec-once = flatpak run com.spotify.Client
exec-once = flatpak run com.bitwarden.desktop
