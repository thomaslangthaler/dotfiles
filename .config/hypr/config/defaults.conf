# ┃                     Defaults Configuration                  ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛


# General
$filemanager = nemo
$applauncher = wofi
$terminal = alacritty
$locker = pidof hyprlock || hyprlock
# Lock after 5 min idle, turn the screens off after 10 min (and back on at the first input)
$idlehandler = swayidle -w timeout 300 '$locker' timeout 600 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep '$locker'

# Pixels per keypress when resizing windows
$resizeStep = 80

# Screenshots
$shot-region = ~/.config/hypr/scripts/screenshot area
$shot-window = ~/.config/hypr/scripts/screenshot window
$shot-screen = ~/.config/hypr/scripts/screenshot output
