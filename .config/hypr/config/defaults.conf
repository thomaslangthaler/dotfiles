# General
$filemanager = nemo
$applauncher = wofi
$terminal = alacritty
$locker = pidof hyprlock || hyprlock
$idlehandler = swayidle -w timeout 300 '$locker' before-sleep '$locker'

# Screenshots
$shot-region = grimblast copy area
$shot-window = grimblast copy active
$shot-screen = grimblast copy output
