# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Windows Rules https://wiki.hyprland.org/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^()$, match:title ^(Picture in picture)$
windowrule = float on, match:class ^(blueman-manager)$
windowrule = float on, match:class ^(CachyOSHello)$
windowrule = float on, match:class ^(zenity)$

# Increase the opacity
windowrule = opacity 0.92, match:class ^(thunar|nemo)$
windowrule = opacity 0.96, match:class ^(discord|armcord|webcord)$
windowrule = opacity 0.95, match:title ^(QQ|Telegram)$
windowrule = opacity 0.95, match:title ^(NetEase Cloud Music Gtk4)$

# General window rules
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = size 960 540, match:title ^(Picture-in-Picture)$
windowrule = move 25% 25%, match:title ^(Picture-in-Picture)$
# Media viewers (matched by class; their titles are the file name)
windowrule = float on, match:class ^(imv|mpv)$
windowrule = move 25% 25%, match:class ^(imv|mpv)$
windowrule = size 960 540, match:class ^(imv|mpv)$
# Floating terminals (matched by the title they are launched with)
windowrule = float on, match:title ^(danmufloat|termfloat|ncmpcpp)$
windowrule = move 25% 25%, match:title ^(danmufloat|termfloat|ncmpcpp)$
windowrule = size 960 540, match:title ^(danmufloat|termfloat|ncmpcpp)$
windowrule = pin on, match:title ^(danmufloat)$
windowrule = rounding 5, match:title ^(danmufloat|termfloat)$
windowrule = animation slide right, match:class ^(kitty|Alacritty)$
windowrule = no_blur on, match:class ^(org.mozilla.firefox)$

# Assign autostarted apps to workspaces (class names from `hyprctl clients`)
windowrule = workspace 1 silent, match:class ^(librewolf)$
windowrule = workspace 2 silent, match:class ^(ferdium)$
windowrule = workspace 2 silent, match:class ^(org.signal.Signal)$
windowrule = workspace 3 silent, match:class ^(org.mozilla.Thunderbird)$
windowrule = workspace 4 silent, match:class ^(Pulsar)$
windowrule = workspace 7 silent, match:class ^(?i:logseq)$
windowrule = workspace 8 silent, match:class ^(spotify)$
windowrule = workspace 10 silent, match:class ^(bitwarden)$

# Windows Rules End #

# Workspaces Rules https://wiki.hyprland.org/Configuring/Workspace-Rules/ #
# Workspaces Rules End #
