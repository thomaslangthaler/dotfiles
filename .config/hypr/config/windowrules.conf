# ┏━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┓
# ┃                    Windowrules Configuration                ┃
# ┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛

# Windows Rules https://wiki.hyprland.org/Configuring/Window-Rules/ #

# Float Necessary Windows
windowrule = float on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, match:class ^()$, match:title ^(Picture in picture)$
windowrulev2 = float on, match:class ^()$, title:^(Save File)$
windowrulev2 = float on, match:class ^()$, title:^(Open File)$
windowrulev2 = float on, match:class ^(LibreWolf)$, title:^(Picture-in-Picture)$
windowrule = float on, match:class ^(blueman-manager)$
windowrulev2 = float on, match:class ^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
windowrulev2 = float on, match:class ^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.kde.polkit-kde-authentication-agent-1)(.*)$
windowrule = float on, match:class ^(CachyOSHello)$
windowrule = float on, match:class ^(zenity)$
windowrulev2 = float on, match:class ^()$, title:^(Steam - Self Updater)$

# Increase the opacity
windowrule = opacity 0.92, match:class ^(thunar|nemo)$
windowrule = opacity 0.96, match:class ^(discord|armcord|webcord)$
windowrule = opacity 0.95, match:title ^(QQ|Telegram)$
windowrule = opacity 0.95, match:title ^(NetEase Cloud Music Gtk4)$

# General window rules
windowrule = float on, match:title ^(Picture-in-Picture)$
windowrule = size 960 540, match:title ^(Picture-in-Picture)$
windowrule = move 25% 25%, match:title ^(Picture-in-Picture)$
windowrule = float on , match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = move 25% 25%, match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = size 960 540, match:title ^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
windowrule = pin on, match:title ^(danmufloat)$
windowrule = rounding 5, match:title ^(danmufloat|termfloat)$
windowrule = animation slide right, match:class ^(kitty|Alacritty)$
windowrule = no_blur on, match:class ^(org.mozilla.firefox)$

# Decorations related to floating windows on workspaces 1 to 10
windowrulev2 = border_size 2, floating 1, workspace:1
windowrulev2 = bordersize 2, floating:1, workspace:2
windowrulev2 = bordersize 2, floating:1, workspace:3
windowrulev2 = bordersize 2, floating:1, workspace:4
windowrulev2 = bordersize 2, floating:1, workspace:5
windowrulev2 = bordersize 2, floating:1, workspace:6
windowrulev2 = bordersize 2, floating:1, workspace:7
windowrulev2 = bordersize 2, floating:1, workspace:8
windowrulev2 = bordersize 2, floating:1, workspace:9
windowrulev2 = bordersize 2, floating:1, workspace:10
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:1
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:2
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:3
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:4
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:5
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:6
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:7
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:8
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:9
windowrulev2 = bordercolor $cachylblue, floating:1, workspace:10
windowrulev2 = rounding 8, floating:1, workspace:1
windowrulev2 = rounding 8, floating:1, workspace:2
windowrulev2 = rounding 8, floating:1, workspace:3
windowrulev2 = rounding 8, floating:1, workspace:4
windowrulev2 = rounding 8, floating:1, workspace:5
windowrulev2 = rounding 8, floating:1, workspace:6
windowrulev2 = rounding 8, floating:1, workspace:7
windowrulev2 = rounding 8, floating:1, workspace:8
windowrulev2 = rounding 8, floating:1, workspace:9
windowrulev2 = rounding 8, floating:1, workspace:10

# Decorations related to tiling windows on workspaces 1 to 10
windowrulev2 = bordersize 3, floating:0, workspace:1
windowrulev2 = bordersize 3, floating:0, workspace:2
windowrulev2 = bordersize 3, floating:0, workspace:3
windowrulev2 = bordersize 3, floating:0, workspace:4
windowrulev2 = bordersize 3, floating:0, workspace:5
windowrulev2 = bordersize 3, floating:0, workspace:6
windowrulev2 = bordersize 3, floating:0, workspace:7
windowrulev2 = bordersize 3, floating:0, workspace:8
windowrulev2 = bordersize 3, floating:0, workspace:9
windowrulev2 = bordersize 3, floating:0, workspace:10
windowrulev2 = rounding 4, floating:0, workspace:1
windowrulev2 = rounding 4, floating:0, workspace:2
windowrulev2 = rounding 4, floating:0, workspace:3
windowrulev2 = rounding 4, floating:0, workspace:4
windowrulev2 = rounding 4, floating:0, workspace:5
windowrulev2 = rounding 4, floating:0, workspace:6
windowrulev2 = rounding 4, floating:0, workspace:7
windowrulev2 = rounding 4, floating:0, workspace:8
windowrulev2 = rounding 4, floating:0, workspace:9
windowrulev2 = rounding 4, floating:0, workspace:10

# Windows Rules End #

# Workspaces Rules https://wiki.hyprland.org/Configuring/Workspace-Rules/ #
workspace = 1, gapsout:5, gapsin:3
workspace = 2, gapsout:5, gapsin:3
workspace = 3, gapsout:5, gapsin:3
workspace = 4, gapsout:5, gapsin:3
workspace = 5, gapsout:5, gapsin:3
workspace = 6, gapsout:5, gapsin:3
workspace = 7, gapsout:5, gapsin:3
workspace = 8, gapsout:5, gapsin:3
workspace = 9, gapsout:5, gapsin:3
workspace = 10, gapsout:5, gapsin:3
# Workspaces Rules End #

# Layers Rules #
layerrulev2 = animation slide top, logout_dialog
layerrulev2 = animation slide down, waybar
layerrulev2 = animation fade, wallpaper
# Layers Rules End #
