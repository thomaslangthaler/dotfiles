# Hyprlock configuration
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock/

general {
    hide_cursor = true
}

background {
    monitor =
    color = rgba(111826ff)
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    inner_color = rgba(182545ff)
    outer_color = rgba(82dcccff)
    font_color = rgba(ffffffff)
    fade_on_empty = false
    placeholder_text = <i>Password…</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(ddddddff)
    font_size = 64
    font_family = Fira Sans
    position = 0, 120
    halign = center
    valign = center
}
